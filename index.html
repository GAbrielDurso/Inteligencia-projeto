<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Materiais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Hub de Materiais 📚</h1>
        <p>Tudo organizado para você não perder o foco.</p>
    </header>

    <main>
        <section class="topico-aula">
            <h2>🧬 Biologia: Aula de Genética</h2>
            
            <div class="mural">
                <div class="cartao pdf">
                    <h3>Resumo do Professor</h3>
                    <p>Arquivo .PDF</p>
                </div>
                
                <div class="cartao video">
                    <h3>Videoaula - DNA e RNA</h3>
                    <p>Link do YouTube</p>
                </div>
                
                <div class="cartao foto">
                    <h3>Foto da Lousa</h3>
                    <p>Arquivo .JPG</p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
